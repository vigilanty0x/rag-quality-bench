name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # Pinned to immutable commits to reduce CI supply-chain drift.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install and attest the pinned build toolchain
        run: |
          python -m pip install --disable-pip-version-check --upgrade -r requirements-build.txt
          python - <<'PY'
          from importlib.metadata import version
          expected = {"pip": "25.2", "setuptools": "80.9.0", "wheel": "0.45.1"}
          actual = {name: version(name) for name in expected}
          if actual != expected:
              raise SystemExit(f"build toolchain mismatch: {actual!r}")
          print(actual)
          PY
      - name: Build wheel and source distribution with the attested backend
        run: |
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
          python - <<'PY'
          from setuptools.build_meta import build_sdist
          print(build_sdist("dist"))
          PY
      - name: Install the built wheel
        run: python -m pip install --no-deps --force-reinstall dist/*.whl
      - run: python scripts/check.py
      - run: python -m unittest discover -s tests -v
      - run: rag-quality-bench validate --suite examples/suite.json
      - run: rag-quality-bench probe --level functional
      - run: rag-quality-bench demo --output reports/demo.json
      - name: Smoke-test packaged demo outside checkout
        working-directory: ${{ runner.temp }}
        run: rag-quality-bench demo --output demo.json
      - run: rag-quality-bench index --suite examples/suite.json --strategy hybrid --output reports/index.json
      - run: rag-quality-bench verify-index --manifest reports/index.json
      - run: rag-quality-bench sweep --suite examples/suite.json --strategies overlap,bm25,hybrid --chunk-sizes 12,20 --overlaps 0,2 --output reports/sweep.json
      - run: rag-quality-bench export --report reports/demo.json --format markdown --output reports/demo.md
      - name: Verify and test the complete source distribution
        env:
          SDIST_ROOT: ${{ runner.temp }}/rag-quality-bench-sdist
        run: |
          python - <<'PY'
          import glob
          import os
          from pathlib import Path
          import tarfile

          archive = Path(glob.glob("dist/*.tar.gz")[0])
          destination = Path(os.environ["SDIST_ROOT"])
          destination.mkdir(parents=True, exist_ok=True)
          with tarfile.open(archive, "r:gz") as bundle:
              members = bundle.getmembers()
              names = {member.name for member in members}
              required_suffixes = {
                  "/examples/suite.json",
                  "/tests/fixtures.py",
                  "/requirements-build.txt",
              }
              missing = [suffix for suffix in required_suffixes if not any(name.endswith(suffix) for name in names)]
              if missing:
                  raise SystemExit(f"incomplete sdist: {missing!r}")
              root = destination.resolve()
              if any(
                  member.issym()
                  or member.islnk()
                  or not (root / member.name).resolve().is_relative_to(root)
                  for member in members
              ):
                  raise SystemExit("sdist contains an unsafe path")
              bundle.extractall(destination, members=members)
          PY
          cd "$SDIST_ROOT"/rag_quality_bench-*
          PYTHONPATH=src python -m unittest discover -s tests -v
